name: Symfony Bundle
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', symfony: '6.4.*', dbal: '^3.10' }
          - { php: '8.2', symfony: '7.4.*', dbal: '^4.4' }
          - { php: '8.4', symfony: '8.1.*', dbal: '^4.4' }
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-test-only-password # gitleaks:allow
          MARIADB_DATABASE: lunixi_symfony
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, curl, json, bcmath, pdo_mysql, pdo_sqlite
          coverage: none
      - name: Resolve supported framework and database adapter
        env:
          FRAMEWORK_VERSION: ${{ matrix.symfony }}
          DBAL_VERSION: ${{ matrix.dbal }}
        run: |
          composer require --no-update "symfony/framework-bundle:${FRAMEWORK_VERSION}" "symfony/cache:${FRAMEWORK_VERSION}" "symfony/console:${FRAMEWORK_VERSION}" "doctrine/dbal:${DBAL_VERSION}"
          composer require --dev --no-update "symfony/browser-kit:${FRAMEWORK_VERSION}" "symfony/security-csrf:${FRAMEWORK_VERSION}" "symfony/yaml:${FRAMEWORK_VERSION}"
          composer update --no-progress --prefer-dist
      - name: Disposable database fixture
        run: |
          php -r 'file_put_contents("/tmp/lunixi-ci-db.json", json_encode(["host"=>"127.0.0.1","port"=>3306,"database"=>"lunixi_symfony","username"=>"root","password"=>"synthetic-test-only-password"])); chmod("/tmp/lunixi-ci-db.json",0600);' # gitleaks:allow
      - run: vendor/bin/phpunit
        env:
          LUNIXI_TEST_DB_FILE: /tmp/lunixi-ci-db.json
      - run: vendor/bin/phpstan analyse --no-progress
      - run: composer audit --locked
      - run: composer archive --format=zip --dir=dist --file=lunixi-symfony-0.1.1
